# @package _global_
#
# Evaluation config for the goal-prior model. Identical to sim_libero.yaml except for the
# task override: the stock config loads the baseline task, which builds a model with no
# aggregator -- the checkpoint goal-prior weights would have nowhere to land and the policy
# would be scored without the channel it was trained on.

defaults:
  - train
  - override /task: libero_goal_prior_stage2
  - _self_

ckpt: null
gpu_id: 0

model:
  load_text_encoder: true
  skip_dit_load_from_pretrain: true
  action_dit_pretrained_path: null

EVALUATION:
  task_suite_name: libero_spatial
  task_id: 0
  num_trials: 50
  output_dir: ./evaluate_results/libero/${hydra:runtime.choices.task}/${now:%Y%m%d_%H%M%S}

  # Runtime behavior
  env_num: 1
  num_steps_wait: 30
  replan_steps: 10
  binarize_gripper: true
  use_action_ensembler: false
  visualize_future_video: false

  # Action inference
  action_horizon: null
  num_inference_steps: ${eval_num_inference_steps}
  sigma_shift: null
  text_cfg_scale: 1.0
  negative_prompt: ""
  rand_device: cpu
  tiled: false
  # Off for the goal-prior model: the goal hook rebuilds the action cross-attention context
  # at every layer, which torch.compile/CUDA-graph capture cannot trace. infer_action raises
  # rather than silently taking a path the model was not trained on. Costs inference speed,
  # so the 190ms latency claim needs re-measuring separately if we want to quote it.
  compile_action_infer: false

  # Optional external inputs
  dataset_stats_path: null
  device: cuda

MULTIRUN:
  create_only: false
  task_file: null
  task_suite_names:
    - libero_10
    - libero_goal
    - libero_spatial
    - libero_object
  num_gpus: 8

hydra:
  job:
    chdir: false
  run:
    dir: .
  output_subdir: null
