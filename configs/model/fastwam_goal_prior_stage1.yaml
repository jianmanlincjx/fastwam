# Stage 1 of the goal-pose prior: a vision-free, pose-conditioned action prior.
#
# The action expert sees language, proprio and an oracle goal pose, and no pixels at
# all, so it cannot memorise appearance and has to use the pose signal. The video
# expert is frozen *and skipped* -- with lambda_video 0 its forward produces no
# gradient, so running it would only cost memory and time.
_target_: fastwam.runtime.create_fastwam
model_id: Wan-AI/Wan2.2-TI2V-5B
tokenizer_model_id: Wan-AI/Wan2.1-T2V-1.3B
tokenizer_max_len: 128
load_text_encoder: false
proprio_dim: ${data.train.processor.proprio_output_dim}
redirect_common_files: true
mot_checkpoint_mixed_attn: false
compile_training_denoise: false
action_dit_pretrained_path: checkpoints/ActionDiT_linear_interp_Wan22_alphascale_1024hdim.pt
skip_dit_load_from_pretrain: false

goal_prior_stage: stage1
goal_prior:
  # The goal is the last observation of the sample window, matching ImageWAM's
  # extract_goal_pose_from_proprio ("Split the last observation as goal").
  num_goal_tokens: 8
  inner_dim: 512
  # Stand-in for the visual span the action expert loses here, so its self-attention
  # attends something rather than only its own 32 action tokens. Appended after the
  # action tokens so their RoPE positions stay 0..31, identical to Stage 2. 0 disables.
  stage1_null_tokens: 32

video_dit_config:
  has_image_input: false
  patch_size: [1, 2, 2]
  in_dim: 48
  hidden_dim: 3072
  ffn_dim: 14336
  freq_dim: 256
  text_dim: 4096
  out_dim: 48
  num_heads: 24
  attn_head_dim: 128
  num_layers: 30
  eps: 1.0e-06
  seperated_timestep: true
  require_clip_embedding: false
  require_vae_embedding: false
  fuse_vae_embedding_in_latents: true
  use_gradient_checkpointing: ${model.mot_checkpoint_mixed_attn}
  video_attention_mask_mode: "first_frame_causal"
  action_conditioned: false
  action_dim: ${data.train.processor.action_output_dim}
  action_group_causal_mask_mode: "group_diagonal"

action_dit_config:
  action_dim: ${data.train.processor.action_output_dim}
  hidden_dim: 1024
  ffn_dim: 4096
  num_heads: 24
  attn_head_dim: 128
  num_layers: 30
  text_dim: 4096
  freq_dim: 256
  eps: 1.0e-06
  use_gradient_checkpointing: ${model.mot_checkpoint_mixed_attn}

video_scheduler:
  train_shift: 5.0
  infer_shift: 5.0
  num_train_timesteps: 1000

action_scheduler:
  train_shift: 1.0
  infer_shift: 1.0
  num_train_timesteps: 1000

loss:
  # No video loss: the video expert is frozen, so this gradient has nowhere to go.
  # ImageWAM leaves lambda_video 0.5 on in its Stage 1, where it is equally inert.
  lambda_video: 0.0
  lambda_action: 1.0
  # Stage 1 has no pose readout to regress -- the pose is an input here, not a
  # prediction. ImageWAM carries lambda_pose 0.3 in its Stage 1 config too, equally
  # unused: its loss_pose only appears in _training_loss_flux2_stage2.
  lambda_pose: 0.0
