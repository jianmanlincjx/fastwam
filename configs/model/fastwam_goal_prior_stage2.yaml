# Stage 2 of the goal-pose prior: the oracle is replaced by latents inferred from the
# observation, behind a gate that starts closed.
#
# Everything trains here, video expert included. The 100 latents are refreshed at every
# backbone layer, reading the text and first-frame visual streams at that depth. Only
# the first frame is read, because that is all infer_action has at test time.
_target_: fastwam.runtime.create_fastwam
model_id: Wan-AI/Wan2.2-TI2V-5B
tokenizer_model_id: Wan-AI/Wan2.1-T2V-1.3B
tokenizer_max_len: 128
load_text_encoder: false
proprio_dim: ${data.train.processor.proprio_output_dim}
redirect_common_files: true
mot_checkpoint_mixed_attn: false
compile_training_denoise: false
action_dit_pretrained_path: checkpoints/ActionDiT_linear_interp_Wan22_alphascale_1024hdim.pt
skip_dit_load_from_pretrain: false

goal_prior_stage: stage2
goal_prior:
  # 100 latents = 8 pose-supervised + 92 free context.
  num_latents: 100
  num_pose_tokens: 8
  num_layer_groups: 5        # ActionDiT has 30 layers -> 6 per group
  latent_dim: 768
  inner_dim: 512

  # Start the synthetic channel as a true no-op. -2.0 suppresses the gated columns about
  # 150x, so step 0 reproduces Stage 1's [text | pose | action] interface instead of a
  # pose-conditioned prior with no pose. Learnable, so the gate can open on its own.
  syn_gate_bias_init: -2.0
  # Gate the 92 context columns only; the 8 pose columns stay open.
  gate_pose_tokens: false

  # Stop the policy leaning on a single aggregate, and give it a fallback state that is
  # exactly Stage 1's interface. Pose tokens are never dropped.
  context_token_dropout: 0.05
  context_blackout_prob: 0.10

  # Plan B channel regime. These are the *effective* ratios ImageWAM trained under
  # (its nominal 0.55/0.15/0.30 lands on 0.50/0.20/0.30 at its bs=10). Sampling uses
  # fixed counts, so copying the nominal numbers to bs=16 would cut p_ref_only to 0.125
  # -- and that path is what breaks dependence on the synthetic channel.
  p_ref_only: 0.20
  p_syn_only: 0.30

video_dit_config:
  has_image_input: false
  patch_size: [1, 2, 2]
  in_dim: 48
  hidden_dim: 3072
  ffn_dim: 14336
  freq_dim: 256
  text_dim: 4096
  out_dim: 48
  num_heads: 24
  attn_head_dim: 128
  num_layers: 30
  eps: 1.0e-06
  seperated_timestep: true
  require_clip_embedding: false
  require_vae_embedding: false
  fuse_vae_embedding_in_latents: true
  use_gradient_checkpointing: ${model.mot_checkpoint_mixed_attn}
  video_attention_mask_mode: "first_frame_causal"
  action_conditioned: false
  action_dim: ${data.train.processor.action_output_dim}
  action_group_causal_mask_mode: "group_diagonal"

action_dit_config:
  action_dim: ${data.train.processor.action_output_dim}
  hidden_dim: 1024
  ffn_dim: 4096
  num_heads: 24
  attn_head_dim: 128
  num_layers: 30
  text_dim: 4096
  freq_dim: 256
  eps: 1.0e-06
  use_gradient_checkpointing: ${model.mot_checkpoint_mixed_attn}

video_scheduler:
  train_shift: 5.0
  infer_shift: 5.0
  num_train_timesteps: 1000

action_scheduler:
  train_shift: 1.0
  infer_shift: 1.0
  num_train_timesteps: 1000

loss:
  # Video expert is unfrozen again, so the world model trains alongside the policy.
  lambda_video: 1.0
  lambda_action: 1.0
  lambda_pose: 0.3
